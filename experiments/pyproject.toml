[project]
name = "sycophancy-experiments"
version = "0.3.0"
description = "Status-based sycophancy experiments on SAGE-Eval prompts"
requires-python = ">=3.12"
# Bounds are deliberately loose: vLLM pins transformers<5 and numpy<2.3, and it
# is the component that must be satisfied first. transformers is used only for
# tokenizers/chat templates here, so its major version is not load-bearing.
dependencies = [
    "vllm>=0.11.0",
    "transformers>=4.56",
    "datasets>=4.0",
    "pandas>=2.2",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sycophancy"]
