[project]
name = "sycophancy-experiments"
version = "0.3.0"
description = "Status-based sycophancy experiments on SAGE-Eval prompts"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
    "vllm>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sycophancy"]
